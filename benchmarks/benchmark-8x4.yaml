# AASTF Benchmark Configuration: 8 Models x 4 Frameworks
# Run: aastf benchmark run --config benchmarks/benchmark-8x4.yaml
#
# Exercises the ASI, MCP, and CVE scenario packs across 8 models and 4 agentic
# frameworks. This file matches the BenchmarkConfig schema in
# src/aastf/benchmark/runner.py (models / frameworks / scenario_packs).
#
# NOTE: direct execution from a config still requires a configured agent factory
# per (model, framework); see benchmarks/README.md. Running without one reports
# the runs as errored rather than producing usable data.

models:
  - name: gpt-4o
    provider: openai
    model_id: gpt-4o
    api_key_env: OPENAI_API_KEY

  - name: gpt-4o-mini
    provider: openai
    model_id: gpt-4o-mini
    api_key_env: OPENAI_API_KEY

  - name: claude-3-5-sonnet
    provider: anthropic
    model_id: claude-3-5-sonnet-20241022
    api_key_env: ANTHROPIC_API_KEY

  - name: claude-3-haiku
    provider: anthropic
    model_id: claude-3-haiku-20240307
    api_key_env: ANTHROPIC_API_KEY

  - name: gemini-1-5-pro
    provider: google
    model_id: gemini-1.5-pro
    api_key_env: GOOGLE_API_KEY

  - name: gemini-1-5-flash
    provider: google
    model_id: gemini-1.5-flash
    api_key_env: GOOGLE_API_KEY

  - name: llama-3-1-70b
    provider: bedrock
    model_id: meta.llama3-1-70b-instruct-v1:0
    api_key_env: AWS_BEARER_TOKEN_BEDROCK

  - name: mistral-large
    provider: azure
    model_id: mistral-large-latest
    api_key_env: AZURE_MISTRAL_API_KEY

frameworks:
  - langgraph
  - crewai
  - openai_agents
  - pydantic_ai

# Scenario ID prefixes to include (matched against scenario IDs like ASI01-001).
scenario_packs:
  - ASI
  - MCP
  - CVE

runs_per_scenario: 3
timeout_per_scenario: 60
output_dir: benchmark-results
