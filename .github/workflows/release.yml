name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write  # Required for Sigstore OIDC signing

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install hatch==1.12.0

      - name: Build sdist and wheel
        run: hatch build

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6db9b8a1f7571828bda739ffc6d32  # v4.6.2
        with:
          name: dist
          path: dist/
          retention-days: 5

  sign:
    name: Sign with Sigstore
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write  # OIDC for Sigstore
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: dist
          path: dist/

      - name: Sign with Sigstore
        uses: sigstore/gh-action-sigstore-python@v3
        with:
          inputs: >-
            ./dist/*.tar.gz
            ./dist/*.whl

      - name: Upload signed artifacts
        uses: actions/upload-artifact@ea165f8d65b6db9b8a1f7571828bda739ffc6d32  # v4.6.2
        with:
          name: dist-signed
          path: dist/
          retention-days: 5

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: sign
    environment: pypi
    permissions:
      id-token: write  # OIDC trusted publisher
    steps:
      - name: Download signed artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: dist-signed
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@76f52bc884231f62b54f72e44f89ce7e40dde4c3  # release/v1.12.4
        with:
          skip-existing: true

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: sign
    permissions:
      contents: write
    steps:
      - name: Download signed artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: dist-signed
          path: dist/

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "AASTF $TAG" \
            --generate-notes \
            dist/*
